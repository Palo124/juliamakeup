<!DOCTYPE html>
<!--
  ADHOC DEV TOOL — delete this file before production if you do not want a public probe UI.

  Open via local/static server (ES modules): e.g. python3 -m http.server 8000
  then http://localhost:8000/dev-booking-test.html
  (file:// will fail to import ./assets/js/config.js)
-->
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DEV — booking API probe</title>
  <style>
    :root { font-family: ui-monospace, monospace; background: #1a1a1a; color: #e8e8e8; }
    body { max-width: 56rem; margin: 0 auto; padding: 1rem 1.25rem 2rem; }
    .dev-banner {
      background: #7a1f1f;
      color: #fff;
      padding: 0.75rem 1rem;
      margin: 0 0 1rem;
      border-radius: 6px;
      font-size: 0.9rem;
      line-height: 1.45;
    }
    label { display: block; margin-top: 0.75rem; font-size: 0.8rem; color: #aaa; }
    input[type="url"], textarea {
      width: 100%;
      box-sizing: border-box;
      margin-top: 0.25rem;
      padding: 0.5rem 0.6rem;
      border-radius: 4px;
      border: 1px solid #444;
      background: #111;
      color: #eee;
      font: inherit;
    }
    textarea { min-height: 12rem; resize: vertical; }
    .row { display: flex; flex-wrap: wrap; gap: 0.5rem; margin-top: 0.75rem; align-items: center; }
    button {
      cursor: pointer;
      padding: 0.45rem 0.85rem;
      border-radius: 4px;
      border: 1px solid #555;
      background: #333;
      color: #fff;
      font: inherit;
    }
    button:hover { background: #444; }
    button.primary { background: #1e5a8e; border-color: #2a7ab8; }
    #out {
      margin-top: 1rem;
      padding: 0.75rem 1rem;
      background: #0d0d0d;
      border: 1px solid #333;
      border-radius: 4px;
      white-space: pre-wrap;
      word-break: break-word;
      min-height: 4rem;
      font-size: 0.82rem;
    }
    .meta { color: #888; font-size: 0.75rem; margin-top: 0.35rem; }
    a { color: #7cb8ff; }
  </style>
</head>
<body>
  <div class="dev-banner">
    <strong>DEV ONLY.</strong> Delete <code>dev-booking-test.html</code> when you no longer need it — anyone with the URL can hammer your web app (same as exposing <code>bookingScriptUrl</code> in the main site).
  </div>

  <h1 style="font-size:1.1rem;font-weight:600;margin:0 0 0.5rem">Booking API probe</h1>
  <p class="meta">Prefills URL from <code>assets/js/config.js</code> → <code>CONFIG.bookingScriptUrl</code>. Override below.</p>

  <label for="baseUrl">Web app /exec URL</label>
  <input id="baseUrl" type="url" placeholder="https://script.google.com/macros/s/…/exec" autocomplete="off">

  <div class="row">
    <button type="button" class="primary" id="btnGet">GET getAvailability</button>
    <button type="button" id="btnPost">POST body (below)</button>
    <button type="button" id="btnClear">Clear output</button>
    <button type="button" id="btnFillSample">Fill sample createReservation</button>
  </div>

  <label for="body">POST JSON body</label>
  <textarea id="body" spellcheck="false"></textarea>

  <div id="out" aria-live="polite"></div>

  <script type="module">
    import { CONFIG } from "./assets/js/config.js";

    const baseUrlEl = document.getElementById("baseUrl");
    const bodyEl = document.getElementById("body");
    const outEl = document.getElementById("out");

    baseUrlEl.value = String(CONFIG.bookingScriptUrl || "").trim();

    function log(line) {
      outEl.textContent += line + "\n";
    }

    function base() {
      const u = String(baseUrlEl.value || "").trim();
      if (!u) {
        throw new Error("Set Web app /exec URL first.");
      }
      return u.replace(/\?.*$/, "");
    }

    document.getElementById("btnClear").addEventListener("click", () => {
      outEl.textContent = "";
    });

    document.getElementById("btnFillSample").addEventListener("click", () => {
      bodyEl.value = JSON.stringify(
        {
          action: "createReservation",
          reservation: {
            slotId: "REPLACE_WITH_REAL_SLOT_ID",
            name: "Dev Test",
            email: "you@example.com",
            phone: "+421900000000",
            service: "Signature Makeup",
            notes: "dev-booking-test.html probe",
            website: "",
          },
        },
        null,
        2,
      );
    });

    document.getElementById("btnGet").addEventListener("click", async () => {
      outEl.textContent = "";
      try {
        const u = new URL(base());
        u.searchParams.set("action", "getAvailability");
        log("→ GET " + u.toString());
        const res = await fetch(u.toString(), {
          method: "GET",
          redirect: "follow",
          headers: { Accept: "application/json" },
        });
        const text = await res.text();
        log("← status " + res.status);
        try {
          log(JSON.stringify(JSON.parse(text), null, 2));
        } catch {
          log(text);
        }
      } catch (e) {
        log(String(e && e.message ? e.message : e));
      }
    });

    document.getElementById("btnPost").addEventListener("click", async () => {
      outEl.textContent = "";
      try {
        const raw = bodyEl.value.trim();
        if (!raw) {
          throw new Error("POST body empty.");
        }
        const payload = JSON.parse(raw);
        const url = base();
        log("→ POST " + url);
        log("body: " + raw);
        const res = await fetch(url, {
          method: "POST",
          redirect: "follow",
          headers: {
            "Content-Type": "text/plain;charset=utf-8",
            Accept: "application/json",
          },
          body: raw,
        });
        const text = await res.text();
        log("← status " + res.status);
        try {
          log(JSON.stringify(JSON.parse(text), null, 2));
        } catch {
          log(text);
        }
      } catch (e) {
        log(String(e && e.message ? e.message : e));
      }
    });
  </script>
</body>
</html>
