<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title id="page-title">Juliére Beauty | Modern makeup studio</title>
  <meta
    name="description"
    data-i18n-content="meta.descriptionBookingAction"
    content="Processing a booking action from your email link."
  >
  <meta name="robots" content="noindex, follow">
        <link rel="alternate" hreflang="sk" href="https://julierebeauty.com/action.html">
  <link rel="alternate" hreflang="en" href="https://julierebeauty.com/en/action.html">
  <link rel="alternate" hreflang="x-default" href="https://julierebeauty.com/action.html">
<link rel="canonical" id="canonical-link" href="https://julierebeauty.com/en/action.html">
  <meta property="og:site_name" content="Juliére Beauty">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://julierebeauty.com/en/action.html">
  <meta
    property="og:title"
    data-i18n-content="meta.titleBookingAction"
    content="Juliére Beauty | Processing booking"
  >
  <meta
    property="og:description"
    data-i18n-content="meta.descriptionBookingAction"
    content="Processing a booking action from your email link."
  >
  <meta property="og:locale" content="en_GB">
  <meta property="og:locale:alternate" content="sk_SK">
  <link rel="icon" href="/assets/img/favicon_juliere.png" type="image/png">
  <link rel="preconnect" href="https://script.google.com">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;600&family=Italiana&family=Manrope:wght@400;500;600;700&display=swap"
    rel="stylesheet"
    media="print"
    onload="this.media='all'"
  >
  <noscript>
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;600&family=Italiana&family=Manrope:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    >
  </noscript>
  <link rel="stylesheet" href="/assets/css/main.css">
</head>
<body data-seo-page="bookingAction">
  <div class="page-shell page-shell--sub booking-action-shell">
    <header class="site-header">
      <a class="brand" href="index.html" data-i18n-aria="header.brandAria" aria-label="Juliére Beauty home">
        <span class="brand-lockup">
          <span class="brand-lockup-primary" data-i18n="header.brandPrimary">Juliére</span>
          <span class="brand-lockup-secondary" data-i18n="header.brandSecondary">Beauty</span>
        </span>
      </a>
    </header>

    <main class="booking-action-page" aria-live="polite">
      <div id="booking-action-card" class="booking-action-card" data-state="loading">
        <div id="booking-action-spinner" class="booking-action-card__spinner" aria-hidden="true"></div>
        <h1 id="booking-action-title" class="booking-action-card__title" data-i18n="booking.actionProcessing">Processing…</h1>
        <p id="booking-action-text" class="booking-action-card__text" data-i18n="booking.actionProcessingBody">Please wait — finishing the action from your email.</p>
        <p id="booking-action-hint" class="booking-action-card__hint" data-i18n="booking.actionProcessingHint">This can take a few seconds. Don’t close the page.</p>
        <a id="booking-action-cta" class="button booking-action-card__cta hidden" href="/booking.html" data-i18n="booking.actionBackToBooking">Back to booking</a>
      </div>
    </main>
  </div>
  <script type="module" src="/assets/js/features/booking-action.js"></script>
</body>
</html>
